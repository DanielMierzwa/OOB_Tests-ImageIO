name: OOB Testing Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  functional-tests:
    name: Functional | Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest-benchmark

      - name: Build ImageIO
        run: python scripts/build_imageio_from_commit.py

      - name: Run Functional Tests
        run: python -m pytest tests/functional/ --benchmark-skip

      - name: Generate MD Report
        if: always()
        run: python scripts/report_generator.py

      - name: Publish Summary
        if: always()
        run: |
          if [ -f raport.md ]; then
            cat raport.md >> $GITHUB_STEP_SUMMARY
          fi
  performance-tests:
    name: Performance Benchmarks | Python 3.13
    needs: functional-tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest-benchmark

      - name: Build ImageIO
        run: python scripts/build_imageio_from_commit.py

      - name: Run Benchmarks
        run: python -m pytest tests/performance/ --benchmark-only --benchmark-json=benchmark-results.json

      - name: Store Benchmark Result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'pytest'
          output-file-path: benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          comment-always: true
          alert-threshold: '130%'
          fail-on-alert: true