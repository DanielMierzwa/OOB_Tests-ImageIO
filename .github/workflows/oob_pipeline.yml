name: OOB Testing Pipeline
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    name: Python ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build ImageIO from selected GitHub commit
        run: python scripts/build_imageio_from_commit.py

      - name: Verify ImageIO installation
        run: |
          python -c "import imageio, importlib.metadata; print('Location:', imageio.__file__); print('Version:', importlib.metadata.version('imageio'))"

      - name: Run Functional & Performance Tests
        run: |
          python -m pytest
        continue-on-error: false

      - name: Generate MD Report
        if: always()
        run: python scripts/report_generator.py

      - name: Publish Summary to GitHub UI
        if: always()
        run: |
          if [ -f raport.md ]; then
            cat raport.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## Błąd: Plik raport.md nie został wygenerowany!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Archive Test Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: testing-outputs-py${{ matrix.python-version }}
          path: |
            raport.md
            coverage.xml
            results.xml
            imageio_build_info.json
          retention-days: 7
